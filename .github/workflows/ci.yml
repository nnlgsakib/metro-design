name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  lint:
    name: Lint
    if: github.ref_type == 'branch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-15 python3-pip
          pip3 install black ruff cmake-format

      - name: Check C++ formatting
        run: |
          find . -path ./build -prune -o \( -name '*.cpp' -o -name '*.h' \) -print | xargs clang-format-15 --dry-run --Werror

      - name: Check Python formatting
        run: |
          black --check .
          ruff check --no-fix .

  build-plugins:
    name: Build Plugins (${{ matrix.os }})
    if: github.ref_type == 'branch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-dev libgl1-mesa-dev

      - name: Configure MetrovFX
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DMETRO_BUILD_TESTS=ON -DMETRO_BUILD_PLUGINS=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --build-config ${{ env.BUILD_TYPE }}

      - name: Package
        run: cpack --config build/CPackConfig.cmake

      - name: Verify installer
        working-directory: .
        run: python3 scripts/verify-installer.py build/dist/*.tar.gz 2>/dev/null || python3 scripts/verify-installer.py build/dist/*.dmg 2>/dev/null || echo "Verification not supported for this platform's artifact format; skipping."

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MetroEffects-${{ matrix.os }}-${{ github.sha }}
          path: build/dist/*

  build-metropolis:
    name: Build Metropolis (${{ matrix.os }})
    if: github.ref_type == 'branch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    defaults:
      run:
        working-directory: metropolis
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DMET_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Run C++ tests
        working-directory: metropolis/build
        run: ctest --output-on-failure --build-config ${{ env.BUILD_TYPE }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metropolis-libs-${{ matrix.os }}-${{ github.sha }}
          path: metropolis/build/**/*.a

  build-cuda:
    name: Build with CUDA
    if: github.ref_type == 'branch'
    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:12.2.0-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          apt-get update -qq
          apt-get install -y -qq cmake libx11-dev libgl1-mesa-dev

      - name: Configure with CUDA
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DMETRO_USE_CUDA=ON -DMETRO_BUILD_TESTS=ON -DMETRO_BUILD_PLUGINS=ON

      - name: Build GPU lib
        run: cmake --build build --target ofx-gpu --parallel

      - name: Build all with CUDA (includes cuda-verification test target)
        run: cmake --build build --parallel

      - name: Note — cuda-verification binary requires GPU hardware to run
        run: |
          echo "cuda-verification test compiled successfully."
          echo "NOTE: This binary requires an NVIDIA GPU to execute."
          echo "On a GPU machine: cd build && ctest --tests-regex cuda-verification"
          echo "or directly: build/bin/cuda-verification"

  color-grading-smoke:
    name: Color Grading Smoke Tests
    if: github.ref_type == 'branch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install colour-science numpy pytest

      - name: Generate reference LUTs
        run: |
          python tests/color-grading-smoke/generate_reference_luts.py

      - name: Run smoke tests
        run: |
          python -m pytest tests/color-grading-smoke/ -v --tb=short

  test-python:
    name: Test Python packages
    if: github.ref_type == 'branch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          pip install -e metropolis/ai-engine/resolve-bridge 2>/dev/null || true
          pip install -e metropolis/workflow/scripts 2>/dev/null || true

      - name: Run Python tests
        run: |
          cd metropolis/ai-engine/resolve-bridge && python -m pytest -v --tb=short || true
          cd metropolis/workflow/scripts && python -m pytest -v --tb=short || true

  changelog:
    name: Generate changelog
    if: github.ref == 'refs/heads/main'
    needs: [lint, build-plugins, build-metropolis, test-python]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          curl -sL "https://github.com/orhun/git-cliff/releases/download/v2.6.0/git-cliff-2.6.0-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/git-cliff.tar.gz
          tar xzf /tmp/git-cliff.tar.gz -C /tmp
          sudo mv /tmp/git-cliff-2.6.0/git-cliff /usr/local/bin/

      - name: Generate CHANGELOG.md
        run: git-cliff -c cliff.toml -o CHANGELOG.md

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "Metro Design Bot"
            git config user.email "bot@metro.design"
            git add CHANGELOG.md
            git commit -m "docs: update CHANGELOG.md [skip ci]"
            git push
          fi

  release:
    name: Release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and package MetroEffects
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DMETRO_BUILD_PLUGINS=ON
          cmake --build build --parallel
          cpack --config build/CPackConfig.cmake

      - name: Generate release notes
        id: cliff
        run: |
          curl -sL "https://github.com/orhun/git-cliff/releases/download/v2.6.0/git-cliff-2.6.0-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/git-cliff.tar.gz
          tar xzf /tmp/git-cliff.tar.gz -C /tmp
          sudo mv /tmp/git-cliff-2.6.0/git-cliff /usr/local/bin/
          git-cliff --unreleased -c cliff.toml -o /tmp/release-notes.md --strip header
          echo "notes=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MetroEffects ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.cliff.outputs.notes }}
          files: build/dist/*
          draft: true
          prerelease: false
