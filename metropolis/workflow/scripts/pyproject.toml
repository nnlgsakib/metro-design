[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "metropolis-workflow"
version = "0.1.0"
description = "DaVinci Resolve workflow automation scripts and batch processing"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=24.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["workflow*"]
