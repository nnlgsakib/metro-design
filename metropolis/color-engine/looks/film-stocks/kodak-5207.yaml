metadata:
  id: kodak-5207
  name: Kodak Vision3 250D 5207
  type: film_emulation
  status: draft
  author: Colorist
  created: "2026-06-04"
  version: 0.1

film_info:
  manufacturer: Kodak
  stock: Vision3 5207
  type: Daylight-balanced camera negative
  base: D55 (daylight)
  iso: 250
  key_characteristics:
    - Daylight-balanced (tungsten needs 80A filter or CC correction)
    - Fine grain (ISO 250 medium-speed stock)
    - Natural skin tone reproduction
    - Wide exposure latitude (~11 stops)
    - Moderate contrast with smooth shoulder

color_characteristics:
  white_point: D55 (5500K)
  gamut: Motion Picture Camera Negative (Kodak)
  transfer_function: Cineon log density
  contrast: 0.50 (normalized scene-linear)
  saturation: 0.75 (relative to scene-linear)

resolve_aces_recipe:
  color_management: ACEScct
  input_transform: "Input — ARRI Alexa"
  reference_gamut: AP0
  working_space: ACEScct AP1
  output_transform: "Output — Rec.709"

  nodes:
    - id: cst_to_neg
      label: CST — LogC to 5207 Neg
      type: ColorSpaceTransform
      params:
        input_color_space: LogC (EI800) AWG
        input_gamma: LogC
        output_color_space: Rec.709
        output_gamma: Cineon

    - id: contrast_adjust
      label: Daylight Contrast
      type: CustomCurves
      params:
        master_contrast: 0.50
        pivot: 0.45
        shadows: 0.10
        highlights: 0.90

    - id: film_grain
      label: Fine Grain Overlay
      type: OFX:metropolis-filmgrain
      params:
        grain_size: 0.4
        intensity: 0.10
        shadows: 0.20
        highlights: 0.03

  notes:
    - 5207 is an excellent all-around daylight stock. Its natural
      color rendering makes it ideal for skin tones and outdoor work.
    - For tungsten light without correction, the image will take on
      a warm orange cast — stylize intentionally or correct to D55.
    - When overexposed by 1 stop, the negative retains excellent
      highlight detail at the cost of slightly elevated grain.

validation:
  skin_tone_line: ~8 deg offset toward red (natural warm)
  preferred_uses:
    - Exterior daylight shooting
    - Naturalistic / documentary style
    - Period films requiring fine grain
  display_requirements:
    - "Minimum: Rec.709 / 100 nits calibrated"
    - "Preferred: P3-DCI / 48 nits"
